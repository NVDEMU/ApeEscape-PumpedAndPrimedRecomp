name: "Ape Escape: Pumped & Primed — Native Desktop Builds"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pumped-primed-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pumped-primed-desktop-builds
  cancel-in-progress: false

jobs:
  native-probe:
    name: Download private CHD and test native recompilation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GAME_ASSETS_LINK: ${{ secrets.GAME_ASSETS_LINK }}
      UPSTREAM_COMMIT: c628ae843209f6e4cef34ec04efb6267a1618882
    steps:
      - name: Check out project desktop patches and launchers
        uses: actions/checkout@v4

      - name: Check required secret
        shell: bash
        run: |
          if [[ -z "${GAME_ASSETS_LINK:-}" ]]; then
            echo "::error::The GAME_ASSETS_LINK Actions secret is missing in this repository."
            echo "Add it under Settings → Secrets and variables → Actions, then rerun this workflow."
            exit 1
          fi
          printf '::add-mask::%s\n' "$GAME_ASSETS_LINK"

      - name: Install build, MEGA download, and CHD tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang cmake ninja-build python3 git \
            megatools mame-tools pkg-config gnupg \
            libsdl2-dev libvulkan-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev

      - name: Download private CHD from MEGA
        shell: bash
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/private-game"
          mkdir -m 700 -p "$download_dir"
          url_file="$RUNNER_TEMP/mega-link.txt"
          chmod 600 "$url_file" 2>/dev/null || true

          # Normalize modern MEGA file links to the legacy URL syntax accepted
          # by megatools 1.10 on Ubuntu. Never print the secret link.
          python3 - "$url_file" <<'PY'
          import os, re, sys
          from urllib.parse import urlsplit
          raw = os.environ["GAME_ASSETS_LINK"].strip()
          if not raw:
              raise SystemExit("GAME_ASSETS_LINK is empty")
          modern = re.search(r"https?://mega\.nz/file/([^/#?]+)#([^&\s]+)", raw)
          if modern:
              link = f"https://mega.co.nz/#!{modern.group(1)}!{modern.group(2)}"
          else:
              old = re.search(r"https?://(?:www\.)?mega\.(?:nz|co\.nz)/#!([^!/?#]+)!([^&\s]+)", raw)
              if old:
                  link = f"https://mega.co.nz/#!{old.group(1)}!{old.group(2)}"
              else:
                  raise SystemExit("The secret must be a public MEGA file link (not a folder link)")
          with open(sys.argv[1], "w", encoding="utf-8") as f:
              f.write(link)
          os.chmod(sys.argv[1], 0o600)
          PY
          MEGA_URL="$(cat "$url_file")"
          if ! megadl --no-progress --path "$download_dir" "$MEGA_URL" >"$RUNNER_TEMP/mega-download.log" 2>&1; then
            echo "::error::MEGA download failed. Check that the share link is valid and its transfer quota is available."
            tail -n 25 "$RUNNER_TEMP/mega-download.log" || true
            exit 1
          fi
          rm -f "$url_file"
          mapfile -t chds < <(find "$download_dir" -type f -iname '*.chd' -size +1M)
          if [[ "${#chds[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one downloaded CHD file; found ${#chds[@]}."
            find "$download_dir" -maxdepth 2 -type f -printf '%f (%s bytes)\n' || true
            exit 1
          fi
          mv "${chds[0]}" "$RUNNER_TEMP/pumped-primed.chd"
          chmod 600 "$RUNNER_TEMP/pumped-primed.chd"
          echo "Private CHD downloaded to runner temp storage (size: $(stat -c '%s' "$RUNNER_TEMP/pumped-primed.chd") bytes)."

      - name: Convert CHD to ISO with CD/DVD-aware handling
        shell: bash
        run: |
          set -euo pipefail
          chdman info -i "$RUNNER_TEMP/pumped-primed.chd" > "$RUNNER_TEMP/chd-info.txt"
          echo "CHD media metadata:"
          cat "$RUNNER_TEMP/chd-info.txt"

          # DVD CHDs use 2048-byte units. This CHD reported 2448-byte
          # MODE1 units (2352-byte raw sector plus 96-byte subchannel), so
          # extract the CD track structure and strip each MODE1/2352 sector
          # down to its 2048-byte ISO payload instead of using extractdvd.
          unit_size="$(sed -nE 's/^Unit Size:[[:space:]]*([0-9,]+).*/\1/p' "$RUNNER_TEMP/chd-info.txt" | head -1 | tr -d ',')"
          case "$unit_size" in
            2048)
              if ! chdman extractdvd -i "$RUNNER_TEMP/pumped-primed.chd" -o "$RUNNER_TEMP/pumped-primed.iso" >"$RUNNER_TEMP/chd-extract.log" 2>&1; then
                echo "::error::DVD extraction failed."
                tail -n 40 "$RUNNER_TEMP/chd-extract.log" || true
                exit 1
              fi
              ;;
            2448|2352)
              if ! chdman extractcd -i "$RUNNER_TEMP/pumped-primed.chd" -o "$RUNNER_TEMP/pumped-primed.cue" >"$RUNNER_TEMP/chd-extract.log" 2>&1; then
                echo "::error::CD track extraction failed."
                tail -n 40 "$RUNNER_TEMP/chd-extract.log" || true
                exit 1
              fi
              python3 - "$RUNNER_TEMP/pumped-primed.cue" "$RUNNER_TEMP/pumped-primed.iso" <<'PY'
          from pathlib import Path
          import re, sys
          cue = Path(sys.argv[1])
          iso = Path(sys.argv[2])
          text = cue.read_text(errors="replace")
          files = re.findall(r'^\s*FILE\s+"([^"]+)"\s+BINARY\s*$', text, re.I | re.M)
          tracks = re.findall(r'^\s*TRACK\s+\d+\s+(\S+)', text, re.I | re.M)
          if len(files) != 1 or len(tracks) != 1:
              raise SystemExit(f"Expected one data track/file in CUE; found {len(files)} file(s), {len(tracks)} track(s).")
          mode = tracks[0].upper()
          source = (cue.parent / files[0]).resolve()
          if not source.is_file():
              raise SystemExit(f"CUE-referenced binary not found: {source.name}")
          idx = re.search(r'^\s*INDEX\s+01\s+(\d{2}):(\d{2}):(\d{2})\s*$', text, re.I | re.M)
          if not idx:
              raise SystemExit("CUE has no INDEX 01 timestamp for its data track.")
          start_frame = (int(idx.group(1)) * 60 + int(idx.group(2))) * 75 + int(idx.group(3))
          if mode == "MODE1/2048":
              with source.open("rb") as src, iso.open("wb") as dst:
                  src.seek(start_frame * 2048)
                  while True:
                      block = src.read(4 * 1024 * 1024)
                      if not block:
                          break
                      dst.write(block)
          elif mode == "MODE1/2352":
              sector_size, data_offset, data_size = 2352, 16, 2048
              size = source.stat().st_size
              if size % sector_size:
                  raise SystemExit(f"Raw MODE1 binary size {size} is not divisible by {sector_size}.")
              sectors = size // sector_size
              if start_frame >= sectors:
                  raise SystemExit(f"CUE INDEX 01 starts at sector {start_frame}, beyond {sectors} sectors.")
              with source.open("rb") as src, iso.open("wb") as dst:
                  src.seek(start_frame * sector_size)
                  for sector_num in range(start_frame, sectors):
                      raw = src.read(sector_size)
                      if len(raw) != sector_size:
                          raise SystemExit(f"Short raw sector at LBA {sector_num}.")
                      if sector_num == start_frame and raw[:12] != b"\x00" + b"\xff" * 10 + b"\x00":
                          raise SystemExit("CUE says MODE1/2352, but first sector lacks a valid CD sync pattern.")
                      dst.write(raw[data_offset:data_offset + data_size])
          else:
              raise SystemExit(f"Unsupported first-track mode {mode!r}; expected MODE1/2048 or MODE1/2352.")
          if not iso.is_file() or iso.stat().st_size == 0:
              raise SystemExit("ISO conversion produced no output.")
          # Confirm a standard ISO9660 primary volume descriptor at LBA 16.
          with iso.open("rb") as f:
              f.seek(16 * 2048)
              header = f.read(7)
          if len(header) != 7 or header[0] != 1 or header[1:6] != b"CD001" or header[6] != 1:
              raise SystemExit(f"Converted ISO still has no valid PVD at LBA 16: {header.hex()}")
          print(f"Converted {mode} track to ISO ({iso.stat().st_size} bytes); PVD validated at LBA 16.")
          PY
              ;;
            *)
              echo "::error::Unsupported CHD unit size '$unit_size'; refusing to guess the disc layout."
              exit 1
              ;;
          esac
          test -s "$RUNNER_TEMP/pumped-primed.iso"
          chmod 600 "$RUNNER_TEMP/pumped-primed.iso"
          echo "Disc image normalized to ISO9660 (size: $(stat -c '%s' "$RUNNER_TEMP/pumped-primed.iso") bytes)."
          rm -f "$RUNNER_TEMP/pumped-primed.chd" "$RUNNER_TEMP/pumped-primed.cue" "$RUNNER_TEMP/pumped-primed.bin"

      - name: Fetch pinned PS2 Web Recomp toolchain
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/snuri00/ps2-web-recomp.git "$RUNNER_TEMP/ps2-web-recomp"
          git -C "$RUNNER_TEMP/ps2-web-recomp" checkout "$UPSTREAM_COMMIT"
          echo "Using upstream PS2 Web Recomp commit: $UPSTREAM_COMMIT"

      - name: Apply native Metal and Win32 surface support
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/scripts/patch-desktop.py" "$RUNNER_TEMP/ps2-web-recomp"

      - name: Recompile and run a short native compatibility probe
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/ps2-web-recomp"
          if scripts/port.sh pumped-primed "$RUNNER_TEMP/pumped-primed.iso" \
              --native-only --frames 1800 --rounds 3 \
              >"$RUNNER_TEMP/recomp-probe.log" 2>&1; then
            echo "probe_exit=0" >> "$GITHUB_OUTPUT"
            echo "Native recompilation pipeline completed."
          else
            rc=$?
            echo "probe_exit=$rc" >> "$GITHUB_OUTPUT"
            echo "::error::The recompilation pipeline failed with exit code $rc."
            tail -n 100 "$RUNNER_TEMP/recomp-probe.log" || true
            exit "$rc"
          fi

      - name: Summarize probe result without publishing game output
        if: always()
        shell: bash
        run: |
          log="$RUNNER_TEMP/recomp-probe.log"
          if [[ -f "$log" ]]; then
            echo "### Pipeline milestones"
            grep -E '^== \[[0-9]+/6\]|^boots |^round [0-9]+:|^Done\.|^Play it natively:' "$log" | tail -n 40 || true
            echo
            echo "### Runtime compatibility signals"
            grep -E '\[ee\] halted:|\[sys\] unhandled syscall|\[iop\] missing|fatal|FATAL|error:' "$log" | tail -n 50 || true
          else
            echo "The pipeline did not start; inspect the earlier setup/download step."
          fi
          echo
          echo "No CHD, ISO, generated game code, executable, screenshots, or game-derived build artifacts are uploaded."


      - name: Prepare encrypted native build inputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ps2-web-recomp"
          test -s "$src/generated/pumped-primed"
          test -s "$src/games/pumped-primed/disc/SLUS_210.96"

          # The native apps ask the user to select an ISO at launch.
          rm -f "$src/games/pumped-primed/disc.iso"
          rm -rf "$src/.git" "$src/build" "$src/tools" "$src/third_party/wgpu-native"
          rm -rf "$src/games/pumped-primed/shots" "$src/games/pumped-primed/vu1" "$src/games/pumped-primed/modules"
          rm -f "$src/games/pumped-primed/explore.log" "$src/games/pumped-primed/explore.ps2" "$src/games/pumped-primed/misses.txt"

          tar -czf "$RUNNER_TEMP/pumped-primed-desktop-input.tar.gz" -C "$RUNNER_TEMP" ps2-web-recomp
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GAME_ASSETS_LINK" \
            --symmetric --cipher-algo AES256 --output "$RUNNER_TEMP/pumped-primed-desktop-input.tar.gz.gpg" \
            "$RUNNER_TEMP/pumped-primed-desktop-input.tar.gz"
          rm -f "$RUNNER_TEMP/pumped-primed-desktop-input.tar.gz"
          echo "Native inputs encrypted before upload."

      - name: Upload encrypted native build inputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pumped-primed-desktop-input-encrypted
          path: ${{ runner.temp }}/pumped-primed-desktop-input.tar.gz.gpg
          if-no-files-found: error
          retention-days: 1

      - name: Offer encrypted ISO converted from the supplied CHD
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          gzip -1 -c "$RUNNER_TEMP/pumped-primed.iso" > "$RUNNER_TEMP/pumped-primed.iso.gz"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GAME_ASSETS_LINK" \
            --symmetric --cipher-algo AES256 --compress-algo none \
            --output "$RUNNER_TEMP/pumped-primed-disc.iso.gz.gpg" "$RUNNER_TEMP/pumped-primed.iso.gz"
          rm -f "$RUNNER_TEMP/pumped-primed.iso.gz"
          echo "The optional ISO is encrypted separately from the application builds."

      - name: Upload optional encrypted ISO
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pumped-primed-disc-iso-encrypted
          path: ${{ runner.temp }}/pumped-primed-disc.iso.gz.gpg
          if-no-files-found: warn
          retention-days: 1

  build-macos:
    name: Build native macOS app (Metal)
    needs: native-probe
    runs-on: macos-15
    timeout-minutes: 120
    env:
      GAME_ASSETS_LINK: ${{ secrets.GAME_ASSETS_LINK }}
    steps:
      - name: Check out app launcher source
        uses: actions/checkout@v4

      - name: Download encrypted build inputs
        uses: actions/download-artifact@v4
        with:
          name: pumped-primed-desktop-input-encrypted
          path: ${{ runner.temp }}/desktop-input

      - name: Install native macOS dependencies
        shell: bash
        run: brew install cmake ninja llvm sdl2 gnupg

      - name: Decrypt and unpack native inputs
        shell: bash
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$GAME_ASSETS_LINK"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GAME_ASSETS_LINK" \
            --decrypt --output "$RUNNER_TEMP/pumped-primed-desktop-input.tar.gz" \
            "$RUNNER_TEMP/desktop-input/pumped-primed-desktop-input.tar.gz.gpg"
          mkdir -p "$RUNNER_TEMP/desktop-source"
          tar -xzf "$RUNNER_TEMP/pumped-primed-desktop-input.tar.gz" -C "$RUNNER_TEMP/desktop-source"
          rm -f "$RUNNER_TEMP/pumped-primed-desktop-input.tar.gz"

      - name: Build native recompiled runner
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/desktop-source/ps2-web-recomp"
          "$src/scripts/fetch_wgpu.sh" v29.0.1.1
          export CXX="$(brew --prefix llvm)/bin/clang++"
          build="$src/build/native-pumped-primed"
          cmake -S "$src" -B "$build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DSDL2_DIR="$(brew --prefix sdl2)/lib/cmake/SDL2" \
            -DPS2_GENERATED="$src/generated/pumped-primed" \
            -DPS2_WGPU_DIR="$src/third_party/wgpu-native"
          cmake --build "$build" --target ps2run --parallel 3
          test -x "$build/ps2run"

      - name: Package macOS app and encrypt it
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/desktop-source/ps2-web-recomp"
          build="$src/build/native-pumped-primed"
          stage="$RUNNER_TEMP/macos-package"
          app="$stage/Ape Escape Pumped and Primed.app"
          game="$app/Contents/Resources/Game"
          mkdir -p "$app/Contents/MacOS" "$game"
          cp "$build/ps2run" "$game/ps2run"
          cp "$src/games/pumped-primed/disc/SLUS_210.96" "$game/SLUS_210.96"

          sdl_load="$(otool -L "$game/ps2run" | sed -n 's/^[[:space:]]*\(.*libSDL2[^ ]*\.dylib\) (.*$/\1/p' | head -1)"
          test -n "$sdl_load"
          sdl_name="$(basename "$sdl_load")"
          sdl_source="$(find "$(brew --prefix sdl2)/lib" -maxdepth 1 -name "$sdl_name" -print -quit)"
          if [[ -z "$sdl_source" ]]; then
            sdl_source="$(find "$(brew --prefix sdl2)/lib" -maxdepth 1 -name 'libSDL2*.dylib' -print -quit)"
            sdl_name="$(basename "$sdl_source")"
          fi
          test -f "$sdl_source"
          cp -L "$sdl_source" "$game/$sdl_name"
          install_name_tool -change "$sdl_load" "@executable_path/$sdl_name" "$game/ps2run"

          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>ApeEscapePumpedAndPrimed</string>
          <key>CFBundleIdentifier</key><string>com.nvdemu.apeescape.pumpedandprimed.recomp</string>
          <key>CFBundleName</key><string>Ape Escape Pumped and Primed</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>0.1.0</string>
          <key>CFBundleShortVersionString</key><string>0.1.0</string>
          <key>LSMinimumSystemVersion</key><string>12.0</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST

          "$CXX" -std=c++20 -O2 -fobjc-arc -framework Cocoa \
            "$GITHUB_WORKSPACE/packaging/macos_launcher.mm" \
            -o "$app/Contents/MacOS/ApeEscapePumpedAndPrimed"
          chmod +x "$app/Contents/MacOS/ApeEscapePumpedAndPrimed"
          codesign --force --deep --sign - "$app"

          dmg="$RUNNER_TEMP/ApeEscape-PumpedAndPrimed-macOS.dmg"
          hdiutil create -volname "Ape Escape Pumped and Primed" -srcfolder "$app" -ov -format UDZO "$dmg"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GAME_ASSETS_LINK" \
            --symmetric --cipher-algo AES256 --output "$RUNNER_TEMP/ApeEscape-PumpedAndPrimed-macOS.dmg.gpg" "$dmg"
          rm -f "$dmg"
          echo "Encrypted native macOS DMG is ready."

      - name: Upload encrypted macOS app
        uses: actions/upload-artifact@v4
        with:
          name: pumped-primed-macos-app-encrypted
          path: ${{ runner.temp }}/ApeEscape-PumpedAndPrimed-macOS.dmg.gpg
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build native Windows app (Win32)
    needs: native-probe
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GAME_ASSETS_LINK: ${{ secrets.GAME_ASSETS_LINK }}
    steps:
      - name: Check out app launcher source
        uses: actions/checkout@v4

      - name: Download encrypted build inputs
        uses: actions/download-artifact@v4
        with:
          name: pumped-primed-desktop-input-encrypted
          path: ${{ runner.temp }}\\desktop-input

      - name: Set up MinGW UCRT64, SDL2, and GnuPG
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            gnupg
            zip

      - name: Decrypt and unpack native inputs
        shell: msys2 {0}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$GAME_ASSETS_LINK"
          TEMP="$(cygpath -u "$RUNNER_TEMP")"
          mkdir -p "$TEMP/desktop-source"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GAME_ASSETS_LINK" \
            --decrypt --output "$TEMP/pumped-primed-desktop-input.tar.gz" \
            "$TEMP/desktop-input/pumped-primed-desktop-input.tar.gz.gpg"
          tar -xzf "$TEMP/pumped-primed-desktop-input.tar.gz" -C "$TEMP/desktop-source"
          rm -f "$TEMP/pumped-primed-desktop-input.tar.gz"

      - name: Build native recompiled runner
        shell: msys2 {0}
        run: |
          set -euo pipefail
          TEMP="$(cygpath -u "$RUNNER_TEMP")"
          src="$TEMP/desktop-source/ps2-web-recomp"
          mkdir -p "$src/third_party/wgpu-native"
          curl -fsSL "https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-windows-x86_64-gnu-release.zip" -o "$TEMP/wgpu-windows.zip"
          unzip -q "$TEMP/wgpu-windows.zip" -d "$src/third_party/wgpu-native"
          build="$src/build/native-pumped-primed"
          cmake -S "$src" -B "$build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$MINGW_PREFIX/bin/g++.exe" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DCMAKE_PREFIX_PATH="$MINGW_PREFIX" \
            -DPS2_GENERATED="$src/generated/pumped-primed" \
            -DPS2_WGPU_DIR="$src/third_party/wgpu-native"
          cmake --build "$build" --target ps2run --parallel 2
          test -f "$build/ps2run.exe"

      - name: Package Windows app and encrypt it
        shell: msys2 {0}
        run: |
          set -euo pipefail
          TEMP="$(cygpath -u "$RUNNER_TEMP")"
          WS="$(cygpath -u "$GITHUB_WORKSPACE")"
          src="$TEMP/desktop-source/ps2-web-recomp"
          build="$src/build/native-pumped-primed"
          stage="$TEMP/windows-package/Ape Escape Pumped and Primed"
          mkdir -p "$stage"
          cp "$build/ps2run.exe" "$stage/ps2run.exe"
          cp "$src/games/pumped-primed/disc/SLUS_210.96" "$stage/SLUS_210.96"
          cp "$MINGW_PREFIX/bin/SDL2.dll" "$stage/SDL2.dll"

          "$MINGW_PREFIX/bin/g++.exe" -std=c++20 -O2 -municode -mwindows \
            -static -static-libgcc -static-libstdc++ \
            "$WS/packaging/windows_launcher.cpp" -o "$stage/ApeEscape-Pumped-And-Primed.exe" \
            -lcomdlg32 -luser32

          mkdir -p "$TEMP/windows-package"
          (cd "$TEMP/windows-package" && zip -0 -r "$TEMP/ApeEscape-PumpedAndPrimed-Windows.zip" "Ape Escape Pumped and Primed")
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GAME_ASSETS_LINK" \
            --symmetric --cipher-algo AES256 --output "$TEMP/ApeEscape-PumpedAndPrimed-Windows.zip.gpg" \
            "$TEMP/ApeEscape-PumpedAndPrimed-Windows.zip"
          rm -f "$TEMP/ApeEscape-PumpedAndPrimed-Windows.zip"
          echo "Encrypted native Windows ZIP is ready."

      - name: Upload encrypted Windows app
        uses: actions/upload-artifact@v4
        with:
          name: pumped-primed-windows-app-encrypted
          path: ${{ runner.temp }}/ApeEscape-PumpedAndPrimed-Windows.zip.gpg
          if-no-files-found: error
          retention-days: 1
